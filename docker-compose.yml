services:
  postgres:
    image: postgres:17
    container_name: task_api_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: task_api
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: task_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_api -d task_api"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: task_api_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.5.2
    container_name: task_api_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  api:
    build: .
    container_name: task_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://task_api:local_dev_password@postgres:5432/task_api
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      RUST_LOG: info,tower_http=info,sqlx=warn
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
